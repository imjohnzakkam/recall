[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supermemory-recall"
dynamic = ["version"]
description = "Semantic memory for your terminal — recall the fix, not just the failure."
readme = "README.md"
license = "MIT"
authors = [{name = "John Zakkam"}]
requires-python = ">=3.10"
dependencies = ["requests"]
keywords = ["terminal", "semantic-search", "memory", "supermemory", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
tui = ["textual>=0.70"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.5", "twine>=5"]

[project.urls]
Homepage = "https://github.com/imjohnzakkam/recall"
Repository = "https://github.com/imjohnzakkam/recall"
Issues = "https://github.com/imjohnzakkam/recall/issues"

[project.scripts]
recall = "recall.cli:main"
recall-ingest = "recall.ingest:main"
recall-seed = "recall.seed:main"
recall-daemon = "recall.daemon:main"
recall-init = "recall.installer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "recall.__version__"}

[tool.setuptools.package-data]
"recall.resources" = ["*.zsh"]

[tool.ruff]
line-length = 100
