[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recall"
version = "0.1.0"
description = "Semantic memory for your terminal — recall the fix, not just the failure."
requires-python = ">=3.10"
dependencies = ["requests"]

[project.scripts]
recall = "recall.cli:main"
recall-ingest = "recall.ingest:main"
recall-seed = "recall.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
